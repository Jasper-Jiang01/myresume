<!DOCTYPE html>
<html lang="zh-CN">

  <head>
    <meta charset="UTF-8">
    <title>rotateY Draggable</title>
    <link rel="stylesheet" href="https://public.codepenassets.com/css/normalize-5.0.0.min.css">
<link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <main class="demo">
	<div class="scene" id="trigger">
		<div class="card" id="card">
			<section class="face front">
				<h1>DRAG<br>TO SPIN</h1>
			</section>

			<section class="face back">
				<h1>DRAG<br>rotateY</h1>
			</section>
		</div>
	</div>

	<p>
		水平拖动或滑动卡片以控制 <code>rotationY</code>。
	</p>


	<div class="controls">
		<label class="toggle">
			<input id="bounded" type="checkbox" checked>
			<span class="switch" aria-hidden="true"></span>
			<span>Mode:</span>
			<strong id="mode">Bounded</strong>
		</label>

		<div class="pill">
			rotationY:
			<strong><span id="value">0</span>°</strong>
		</div>

		<button id="reset">Reset</button>
	</div>
</main>

<!-- OKAY DEV - Branding -->

    <script src='https://unpkg.com/gsap@3/dist/gsap.min.js'></script>
<script src='https://unpkg.com/gsap@3/dist/Draggable.min.js'></script>
<script src='https://unpkg.com/gsap@3/dist/InertiaPlugin.min.js'></script><script  src="./script.js"></script>

  </body>
  
</html>
